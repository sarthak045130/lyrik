<!doctype html><meta charset="utf-8">
<style>
  body{font:13px -apple-system,system-ui;margin:0;padding:18px;background:#2b2b2e;color:#eee;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;height:100vh;box-sizing:border-box}
  input[type=color]{width:120px;height:40px;border:0;background:none;cursor:pointer}
  input[type=range]{width:240px}
  button{background:#444;color:#fff;border:0;border-radius:6px;padding:4px 12px}
</style>
<div id="label"></div><div id="ctl"></div>
<script>
  const q = new URLSearchParams(location.search), key = q.get('key'), val = q.get('value');
  label.textContent = q.get('label').replace('…','');
  if (key === 'size') {
    ctl.innerHTML = '<input id="r" type="range" min="0.6" max="1.6" step="0.05"> <button id="x">Reset</button>';
    r.value = val;
    r.oninput = () => api.pickColor('size', r.value);
    x.onclick = () => { r.value = 1; api.pickColor('size', 1); };
  } else {
    ctl.innerHTML = '<input id="c" type="color">'; c.value = val;
    c.oninput = () => api.pickColor(key, c.value);
  }
</script>
