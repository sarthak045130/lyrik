<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lyrik — Edge Lights</title>
<style>
  :root{--bg:#1c1c1f;--card:#26262a;--line:#38383e;--tx:#f2f2f4;--dim:#9a9aa4;--acc:#ff8a4c;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font:13px/1.35 var(--font);padding:18px 20px 28px;-webkit-font-smoothing:antialiased;user-select:none}
  h1{font-size:18px;font-weight:700;margin-bottom:2px}
  .sub{color:var(--dim);margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .card h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px}
  .row+.row{margin-top:6px}
  .row label{flex:0 0 auto}
  .row:has(input[type=range]) label{width:125px}
  .seg{display:flex;background:#16161a;border-radius:8px;padding:2px;gap:2px}
  .seg button{background:none;border:0;color:var(--dim);padding:5px 10px;border-radius:6px;font:inherit;cursor:pointer;white-space:nowrap}
  .seg button.on{background:#3a3a42;color:var(--tx)}
  select{background:#16161a;color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:inherit;max-width:230px}
  input[type=range]{flex:1;accent-color:var(--acc);min-width:120px}
  .val{width:34px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
  input[type=color]{width:44px;height:30px;border:1px solid var(--line);border-radius:7px;background:none;padding:2px;cursor:pointer}
  .sw{position:relative;width:38px;height:22px;background:#3a3a42;border-radius:11px;cursor:pointer;transition:background .2s;flex:0 0 auto}
  .sw::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
  .sw.on{background:var(--acc)}.sw.on::after{transform:translateX(16px)}
  .colors{display:flex;gap:8px}
  .colors div{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:11px}
  .colors div.off{opacity:.25;pointer-events:none}
  .edges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .edges button{background:#16161a;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:7px 0;font:inherit;cursor:pointer}
  .edges button.on{background:#3a3a42;color:var(--tx);border-color:#55555f}
  .presets{display:flex;flex-wrap:wrap;gap:6px}
  .presets button{border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 8px;color:var(--tx);background:#16161a;font:inherit;cursor:pointer;display:flex;align-items:center;gap:7px}
  .presets i{width:34px;height:10px;border-radius:5px;display:block}
  .btn{background:var(--acc);color:#1b1006;border:0;border-radius:8px;padding:7px 14px;font:600 13px var(--font);cursor:pointer}
  .btn.ghost{background:#3a3a42;color:var(--tx)}
  .note{color:var(--dim);font-size:11.5px;margin-top:4px}
  .tag{font-size:10px;color:var(--acc);margin-left:6px;letter-spacing:.04em}
  #status{color:var(--dim);font-size:12px;margin-top:6px}
  #status b{color:var(--tx);font-weight:600}
</style>
</head>
<body>
  <h1>Edge Lights</h1>
  <div class="sub">A glowing strip that travels around your screen edges.</div>

  <div class="card">
    <div class="row"><label>Edge Lights</label><div class="sw" id="on"></div></div>
    <div class="row"><label>Motion</label><div class="seg" id="reaction"><button data-v="moving">Constant Moving</button><button data-v="beat">Beat Sync</button></div></div>
    <div class="note" id="motionNote"></div>
    <div class="row" style="margin-top:10px"><label>Direction</label><div class="seg" id="direction"><button data-v="ccw">Counter-clockwise</button><button data-v="cw">Clockwise</button></div></div>
    <div class="row"><label>Strips</label><div class="seg" id="strips"><button data-v="1" data-num="1">1</button><button data-v="2" data-num="1">2</button><button data-v="3" data-num="1">3</button></div></div>
  </div>

  <div class="card">
    <h2>Color</h2>
    <div class="row"><label>Mode</label>
      <select id="colorMode">
        <option value="auto">Album Art (auto)</option><option value="ends">Body + Ends (2 colors)</option><option value="single">Single Color</option>
        <option value="gradient">Two-Color Gradient</option><option value="palette">Three-Color Palette</option><option value="rainbow">Rainbow</option>
      </select></div>
    <div class="row"><label>Colors</label>
      <div class="colors">
        <div id="w0"><input type="color" id="c0"><span id="l0">Front</span></div>
        <div id="w1"><input type="color" id="c1"><span id="l1">Middle</span></div>
        <div id="w2"><input type="color" id="c2"><span id="l2">Back</span></div>
      </div></div>
    <div class="row" style="align-items:flex-start;margin-top:10px"><label>Presets</label>
      <div class="presets" id="presets"></div></div>
  </div>

  <div class="card">
    <h2>Edges</h2>
    <div class="edges" id="edges"><button data-e="top">Top</button><button data-e="right">Right</button><button data-e="bottom">Bottom</button><button data-e="left">Left</button></div>
  </div>

  <div class="card">
    <h2>Strip</h2>
    <div class="row"><label>Speed</label><input type="range" id="speed" min="0" max="1" step="0.01"><span class="val" id="v-speed"></span></div>
    <div class="row"><label>Length</label><input type="range" id="tail" min="0" max="1" step="0.01"><span class="val" id="v-tail"></span></div>
    <div class="row"><label>Thickness</label><input type="range" id="thickness" min="0" max="1" step="0.01"><span class="val" id="v-thickness"></span></div>
    <div class="row"><label>Glow</label><input type="range" id="glow" min="0" max="1" step="0.01"><span class="val" id="v-glow"></span></div>
    <div class="row"><label>Resting outline</label><input type="range" id="outline" min="0" max="1" step="0.01"><span class="val" id="v-outline"></span></div>
    <div class="row"><label>Brightness</label><input type="range" id="intensity" min="0.1" max="1" step="0.01"><span class="val" id="v-intensity"></span></div>
  </div>

  <div class="card">
    <h2>Beat Sync options<span class="tag">BEAT SYNC ONLY</span></h2>
    <div class="row"><label>Beat sensitivity</label><input type="range" id="sensitivity" min="0" max="1" step="0.01"><span class="val" id="v-sensitivity"></span></div>
    <div class="row"><label>Pulse fade</label><input type="range" id="fade" min="0" max="1" step="0.01"><span class="val" id="v-fade"></span></div>
    <div class="row"><label>Listen to</label>
      <select id="audio"><option value="system">System audio (recommended)</option><option value="mic">Microphone</option><option value="off">Nothing (steady pace)</option></select></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="preview">Preview beat (120 BPM)</button><button class="btn ghost" id="reset">Reset</button></div>
    <div id="status"></div>
  </div>

<script>
  const $ = (s) => document.querySelector(s);
  const DEF = { on: true, reaction: 'moving', colorMode: 'auto', colors: ['#ffaa58', '#e63c14', '#e0451a'],
    edges: { top: true, right: true, bottom: true, left: true }, direction: 'ccw', strips: 1, speed: 0.59, tail: 0.5, thickness: 0.6,
    glow: 0.35, outline: 0, intensity: 0.9, sensitivity: 0.5, fade: 0.5, audio: 'system' };
  // 3-colour palettes run front → middle → back
  const PRESETS = {
    Amber: ['ends', ['#ffaa58', '#e63c14']], Sunset: ['palette', ['#ffd36e', '#ff7e5f', '#c0305a']],
    Ocean: ['palette', ['#7bffd2', '#00a8ff', '#0b3dff']], Neon: ['palette', ['#2bffe6', '#a24bff', '#ff2bd6']],
    Fire: ['palette', ['#fff1a8', '#ff9100', '#ff2d00']], Aurora: ['palette', ['#b8ff9a', '#00c6ff', '#9b5cff']],
    'Pure White': ['single', ['#ffffff', '#ffffff', '#ffffff']],
  };
  let L = { ...DEF };
  const patch = (p) => window.api.lights(p);

  document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    patch({ [seg.id]: b.dataset.num ? +b.dataset.v : b.dataset.v });
  }));
  $('#on').onclick = () => patch({ on: !L.on });
  $('#colorMode').onchange = (e) => patch({ colorMode: e.target.value });
  $('#audio').onchange = (e) => patch({ audio: e.target.value });
  ['c0', 'c1', 'c2'].forEach((id, i) => { $('#' + id).oninput = (e) => { const c = L.colors.slice(); c[i] = e.target.value; patch({ colors: c, colorMode: L.colorMode === 'auto' || L.colorMode === 'rainbow' ? 'ends' : L.colorMode }); }; });
  document.querySelectorAll('#edges button').forEach((b) => b.onclick = () => patch({ edges: { [b.dataset.e]: !L.edges[b.dataset.e] } }));
  ['speed', 'tail', 'thickness', 'glow', 'outline', 'intensity', 'sensitivity', 'fade'].forEach((k) => { $('#' + k).oninput = (e) => patch({ [k]: +e.target.value }); });
  $('#preview').onclick = () => patch({ preview: !L.preview });
  $('#reset').onclick = () => patch({ ...DEF, preview: false });
  const pr = $('#presets');
  for (const [name, [mode, cols]] of Object.entries(PRESETS)) {
    const b = document.createElement('button');
    b.innerHTML = `<i style="background:linear-gradient(90deg,${cols.join(',')})"></i>${name}`;
    b.onclick = () => patch({ colorMode: mode, colors: cols });
    pr.append(b);
  }

  function render(l) {
    L = l;
    $('#on').classList.toggle('on', l.on);
    for (const id of ['reaction', 'direction', 'strips']) document.querySelectorAll(`#${id} button`).forEach((b) => b.classList.toggle('on', b.dataset.v === String(l[id])));
    $('#motionNote').textContent = l.reaction === 'beat'
      ? 'The strip keeps moving, surges forward and flares on every beat of your music.'
      : 'The strip circles the screen at a steady pace — no audio needed.';
    $('#colorMode').value = l.colorMode; $('#audio').value = l.audio;
    ['c0', 'c1', 'c2'].forEach((id, i) => {
      $('#' + id).value = l.colors[i] || '#ffffff';
      const used = l.colorMode === 'single' ? 1 : (l.colorMode === 'gradient' || l.colorMode === 'ends') ? 2 : l.colorMode === 'palette' ? 3 : 0;
      $('#l0').textContent = l.colorMode === 'ends' ? 'Body' : 'Front'; $('#l1').textContent = l.colorMode === 'ends' ? 'Ends' : l.colorMode === 'gradient' ? 'Back' : 'Middle';
      $('#w' + i).classList.toggle('off', i >= used);
    });
    document.querySelectorAll('#edges button').forEach((b) => b.classList.toggle('on', !!l.edges[b.dataset.e]));
    for (const k of ['speed', 'tail', 'thickness', 'glow', 'outline', 'intensity', 'sensitivity', 'fade']) { $('#' + k).value = l[k]; $('#v-' + k).textContent = Math.round(l[k] * 100); }
    $('#preview').textContent = l.preview ? 'Stop preview' : 'Preview beat (120 BPM)';
  }
  window.api.onSettings((s) => s.lights && render(s.lights));
  window.api.onLightsStatus((t) => { $('#status').innerHTML = t ? 'Status: <b>' + t.replace(/[&<>]/g, '') + '</b>' : ''; });
  window.api.ready();
</script>
</body>
</html>
